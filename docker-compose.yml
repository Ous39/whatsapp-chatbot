services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oceanbrown
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oceanbrown}
      POSTGRES_DB: oceanbrown
    # Bound to localhost only: the database must never be reachable from the internet.
    ports: ["127.0.0.1:5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceanbrown"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: quay.io/minio/minio:latest  # pin a release tag for production
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-change-me-locally}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio_data:/data]
  migrate:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://oceanbrown:${POSTGRES_PASSWORD:-oceanbrown}@postgres:5432/oceanbrown
    working_dir: /app/packages/db
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://oceanbrown:${POSTGRES_PASSWORD:-oceanbrown}@postgres:5432/oceanbrown
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    build: {context: ., dockerfile: apps/worker/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://oceanbrown:${POSTGRES_PASSWORD:-oceanbrown}@postgres:5432/oceanbrown
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
  minio_data:
