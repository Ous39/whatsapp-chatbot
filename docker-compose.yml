services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oceanbrown
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oceanbrown}
      POSTGRES_DB: oceanbrown
    # Bound to localhost only: the database must never be reachable from the internet.
    ports: ["127.0.0.1:5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceanbrown"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    # Not used by the application yet (media storage is on the roadmap). Pin a release tag before relying on it.
    image: quay.io/minio/minio:latest
    profiles: ["storage"]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-change-me-locally}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio_data:/data]
  migrate:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://oceanbrown:${POSTGRES_PASSWORD:-oceanbrown}@postgres:5432/oceanbrown
    working_dir: /app/packages/db
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://oceanbrown:${POSTGRES_PASSWORD:-oceanbrown}@postgres:5432/oceanbrown
      REDIS_URL: redis://redis:6379
      # Overrides any NODE_ENV in .env: containers always run in production mode.
      NODE_ENV: production
    # Localhost only: the reverse proxy (Caddy/Nginx) on this host terminates TLS and forwards here.
    ports: ["127.0.0.1:4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    build: {context: ., dockerfile: apps/worker/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://oceanbrown:${POSTGRES_PASSWORD:-oceanbrown}@postgres:5432/oceanbrown
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
  # Public entry point: terminates TLS and forwards to web:3000 and api:4000 over the internal network.
  # nginx.conf and nginx-ssl/ (certificate and private key) live only on the server and are not committed.
  nginx:
    image: nginx:1.24-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
  # Optional Wolof voice: docker compose --profile voice up -d tts-wolof
  tts-wolof:
    build: ./services/tts-wolof
    profiles: ["voice"]
    environment:
      TTS_TOKEN: ${TTS_WO_TOKEN:-}
    ports: ["127.0.0.1:8000:8000"]
volumes:
  postgres_data:
  redis_data:
  minio_data:
